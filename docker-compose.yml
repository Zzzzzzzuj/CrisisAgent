services:
  postgres:
    image: postgres:16
    container_name: crisisagent-postgres
    environment:
      POSTGRES_DB: crisis_agent
      POSTGRES_USER: crisis_agent
      POSTGRES_PASSWORD: crisis_agent_dev_password
    ports:
      - "5432:5432"
    volumes:
      - crisisagent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisis_agent -d crisis_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crisisagent_postgres_data:
