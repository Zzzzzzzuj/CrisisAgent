name: Eval CI Gate

"on":
  push:
  pull_request:

jobs:
  offline-eval:
    name: Offline tests and Eval Gate
    runs-on: ubuntu-latest
    env:
      AGENT_MODE: mock
      CHECKPOINT_STORAGE: json
      RUNTIME_MODE: sync
      TASK_QUEUE_BACKEND: inprocess
      EMBEDDING_MODEL: hash
      VECTOR_BACKEND: json
      AUTH_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -m pytest tests -q

      - name: Run Eval CI Gate
        run: python scripts/run_eval_center.py --min-pass-rate 0.8 --output data/eval_report.json
